name: Stockscans classification

# Weekly + manual. Fetches each liquid company's PUBLIC Stockscans page
# (/company/NSE:<symbol>) and extracts its industry classification into
# public/data/stockscans-classification.json — later consumed by the dashboard's
# sector filter + peer engine. No login / browser: plain fetch + parse.
on:
  workflow_dispatch:
    inputs:
      max_companies:
        description: "Companies to classify this run (blank = all liquid). Set 5 for a smoke."
        required: false
        default: "5"
      start_at:
        description: "Resume offset (index into liquid-universe.json)."
        required: false
        default: "0"
  # Weekly auto-refresh so the dashboard's Stockscans industries stay current.
  # Monday 02:47 UTC (08:17 IST) — AFTER Sunday's "Weekly full refresh" has
  # rebuilt liquid-universe.json, and off the :00/:15/:30/:45 marks GitHub queues.
  # A scheduled run passes no inputs, so MAX_COMPANIES/START_AT resolve empty and
  # the scraper classifies the FULL liquid set (it skips names already tagged, so
  # this mainly picks up newly-liquid companies each week).
  # NOTE: GitHub only fires `schedule:` from the default branch — this starts
  # running weekly once merged to main.
  schedule:
    - cron: "47 2 * * 1" # 02:47 UTC Mon = 08:17 IST Mon

permissions:
  contents: write

concurrency:
  group: stockscans-classification
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Scrape Stockscans classification
        env:
          MAX_COMPANIES: ${{ inputs.max_companies }}
          START_AT: ${{ inputs.start_at }}
        run: node scrapers/stockscans-classify.mjs

      - name: Upload classification artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: stockscans-classification
          if-no-files-found: ignore
          path: |
            public/data/stockscans-classification.json
            public/data/stockscans-classification-debug.json

      - name: Commit classification to public/data/
        if: ${{ always() }}
        run: |
          set -e
          BR="${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/stockscans-classification.json public/data/stockscans-classification-debug.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No classification changes to commit."
            exit 0
          fi
          git commit -m "data: refresh Stockscans classification [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$BR"; then echo "pushed"; exit 0; fi
            git fetch origin "$BR"
            git rebase "origin/$BR"
            sleep $((2 ** i))
          done
          echo "push failed after 5 attempts"; exit 1
